<div class="settings-container">
  <div class="header-breadcrumb">
    <span class="breadcrumb-link">Dashboard</span> > <span class="breadcrumb-current">Settings</span>
  </div>
  
  <div class="settings-header">
    <h1>Settings</h1>
    <p>Manage all settings here</p>
  </div>

  <div class="settings-layout">
    <!-- Sidebar -->
    <div class="settings-sidebar">
      <div class="search-box">
        <i class="pi pi-search"></i>
        <input type="text" pInputText placeholder="Search" />
      </div>
      
      <ul class="settings-menu">
        <li *ngFor="let item of menuItems" 
            [class.active]="activeSection === item"
            (click)="setActiveSection(item)">
          {{ item }}
        </li>
      </ul>
    </div>

    <!-- Content Area -->
    <div class="settings-content">
      <div *ngIf="activeSection === 'Profile Setting'" class="profile-section">
        <div class="profile-header">
          <h2>Your Profile</h2>
          <div class="avatar-container">
            <p-avatar icon="pi pi-user" styleClass="mr-2" size="xlarge" shape="circle" [style]="{'background-color': '#ccc', 'color': '#fff'}"></p-avatar>
          </div>
        </div>

        <div class="form-section">
          <h3>Personal Info</h3>
          
          <div class="form-grid">
            <div class="form-group">
              <label>Full Name</label>
              <input type="text" pInputText [(ngModel)]="userProfile.fullName" />
            </div>
            
            <div class="form-group">
              <label>User Name</label>
              <input type="text" pInputText [(ngModel)]="userProfile.userName" />
            </div>
            
            <div class="form-group">
              <label>Access Level</label>
              <input type="text" pInputText [(ngModel)]="userProfile.accessLevel" [disabled]="true" />
            </div>
            
            <div class="form-group">
              <label>Date Joined</label>
              <input type="text" pInputText [(ngModel)]="userProfile.dateJoined" [disabled]="true" />
            </div>
            
            <div class="form-group">
              <label>Contact Number</label>
              <input type="text" pInputText [(ngModel)]="userProfile.contactNumber" />
            </div>
            
            <div class="form-group">
              <label>Emergency Contact</label>
              <input type="text" pInputText [(ngModel)]="userProfile.emergencyContact" />
            </div>
            
            <div class="form-group full-width">
              <label>Work Email</label>
              <input type="text" pInputText [(ngModel)]="userProfile.workEmail" />
            </div>
          </div>
          
          <div class="form-actions">
            <button pButton label="Save" class="p-button-primary" (click)="saveProfile()"></button>
          </div>
        </div>
      </div>
      
      <div *ngIf="activeSection !== 'Profile Setting'" class="placeholder-content">
        <h2>{{ activeSection }}</h2>
        <p>Content for {{ activeSection }} goes here.</p>
      </div>
    </div>
  </div>
</div>
