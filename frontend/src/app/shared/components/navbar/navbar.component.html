<nav class="navbar">
  <div class="nav-items">
    <ng-container *ngFor="let item of menuItems">
      <!-- Regular Menu Item -->
      <a *ngIf="!item.children" 
         [routerLink]="item.route" 
         class="nav-item" 
         [class.active]="isActive(item.route)">
        <span>{{ item.label }}</span>
        <span *ngIf="item.badge" class="badge">{{ item.badge }}</span>
      </a>

      <!-- Dropdown Menu Item -->
      <div *ngIf="item.children" class="nav-item dropdown-trigger" 
           [class.active]="isActive(item.route) || activeDropdown === item.label"
           (click)="toggleDropdown(item.label)">
        <span>{{ item.label }}</span>
        <span *ngIf="item.badge" class="badge">{{ item.badge }}</span>
        <i class="fas fa-chevron-down ml-1" style="font-size: 0.7rem;"></i>
        
        <div class="dropdown-menu" *ngIf="activeDropdown === item.label" (click)="$event.stopPropagation()">
          <a *ngFor="let child of item.children" 
             [routerLink]="child.route"
             class="dropdown-item"
             [class.active]="isActive(child.route)"
             (click)="activeDropdown = null">
            {{ child.label }}
          </a>
        </div>
      </div>
    </ng-container>
  </div>

    <div class="header-actions">
      <button class="icon-btn notification-btn" (click)="toggleNotificationPanel()">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
          <path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75v-.7V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0" />
        </svg>
        <span *ngIf="notificationService.totalPendingCount > 0" class="notification-badge">
          {{ notificationService.totalPendingCount }}
        </span>
      </button>
      
      <div class="profile-dropdown-container">
        <button class="icon-btn profile-btn" (click)="toggleProfileMenu()">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
          </svg>
        </button>
        
        <div class="profile-dropdown-menu" *ngIf="showProfileMenu">
          <a routerLink="/settings" class="dropdown-item"><i class="fas fa-cog"></i> Profile settings</a>
          <a (click)="logout()" class="dropdown-item"><i class="fas fa-sign-out-alt"></i> Log out</a>
        </div>
      </div>
    </div>
  </nav>

  <app-notification-panel *ngIf="showNotificationPanel" (close)="closeNotificationPanel()"></app-notification-panel>
