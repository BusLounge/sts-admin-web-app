<div class="bus-container">
  <div class="top-navigation-row">
    <div class="app-branding">
      <div class="logo-circle">
        <i class="fas fa-key"></i>
      </div>
      <span class="app-name">BusLounge</span>
    </div>
    <app-navbar></app-navbar>
    <div class="header-actions">
      <button class="icon-btn notification-btn" (click)="toggleNotificationPanel()">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
          <path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75v-.7V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0" />
        </svg>
      </button>
      <div class="profile-dropdown-container">
        <button class="icon-btn profile-btn" (click)="toggleProfileMenu()">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
          </svg>
        </button>
        <div class="dropdown-menu" *ngIf="showProfileMenu">
          <a routerLink="/settings" class="dropdown-item">
            <i class="fas fa-cog"></i> Profile setting
          </a>
          <a (click)="logout()" class="dropdown-item">
            <i class="fas fa-sign-out-alt"></i> Log out
          </a>
        </div>
      </div>
    </div>
  </div>

  <div class="page-header">
    <div class="header-content">
      <h2>OTP Master Dashboard</h2>
    </div>
  </div>

  <div class="toolbar">
    <div class="search-filter-container">
      <div class="search-wrapper">
        <input
          type="text"
          class="search-input"
          placeholder="Search phone or OTP..."
          [(ngModel)]="filter"
          (ngModelChange)="onFilterChange()"
        />
        <button class="clear-search-btn" (click)="filter=''; onFilterChange()" *ngIf="filter">×</button>
      </div>
      <div class="filter-container">
        <select [(ngModel)]="selectedApp" (ngModelChange)="onFilterChange()" class="filter-select">
          <option value="all">All Apps</option>
          <option value="lounge_owner">lounge_owner</option>
          <option value="driver_conductor">driver_conductor</option>
          <option value="passenger">passenger</option>
          <option value="admin">admin</option>
        </select>
      </div>
    </div>
    <div class="toolbar-actions">
      <button class="export-btn" (click)="fetchOTPData(true)" [disabled]="loading">
        <i class="pi pi-refresh" [ngClass]="{'spinning': loading}"></i> Refresh
      </button>
    </div>
  </div>

  <table class="bus-table">
    <thead>
      <tr>
        <th>OTP</th>
        <th>Phone</th>
        <th>App Name</th>
        <th>Created At</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let row of filteredData">
        <td><span class="otp-badge">{{ row.otp }}</span></td>
        <td>{{ row.phone || "-" }}</td>
        <td>{{ row.app_name || "-" }}</td>
        <td>{{ formatDate(row.created_at) }}</td>
        <td>
          <button
            class="action-btn edit-btn"
            style="background: transparent; border: none; color: var(--text-secondary); cursor: pointer;"
            (click)="copyToClipboard(row.otp, row.id)"
            title="Copy OTP"
          >
            <i class="pi pi-check-circle" *ngIf="copiedId === row.id" style="color: #10b981;"></i>
            <i class="pi pi-copy" *ngIf="copiedId !== row.id"></i>
          </button>
        </td>
      </tr>
      <tr *ngIf="!loading && filteredData.length === 0">
        <td colspan="5" class="no-data">No OTP records found</td>
      </tr>
      <tr *ngIf="loading && otpData.length === 0">
        <td colspan="5" class="no-data">Loading...</td>
      </tr>
    </tbody>
  </table>
</div>
