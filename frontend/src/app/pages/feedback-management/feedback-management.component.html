<div class="feedback-container">
  <div class="top-navigation-row">
    <div class="app-branding">
      <div class="logo-circle">
        <i class="fas fa-bus"></i>
      </div>
      <span class="app-name">BusLounge</span>
    </div>
    <app-navbar></app-navbar>
    <div class="header-actions">
      <button class="icon-btn notification-btn">
        <i class="pi pi-bell"></i>
      </button>
      <button class="icon-btn profile-btn">
        <i class="pi pi-user"></i>
      </button>
    </div>
  </div>

  <div class="page-header">
    <h1>Feedback Management</h1>
    
    <div class="search-filter-box">
      <div class="search-header">
        <span>Search Feedback</span>
      </div>
      <div class="search-content">
        <h3>Sort by</h3>
        <div class="filter-tags">
          <span class="tag">User Role</span>
          <span class="tag">Date</span>
          <span class="tag">Rating</span>
          <span class="tag">Status</span>
        </div>
      </div>
    </div>
  </div>

  <div class="tabs-container">
    <div class="tabs">
      <button [class.active]="activeTab === 'All'" (click)="setActiveTab('All')">All</button>
      <button [class.active]="activeTab === 'Passenger'" (click)="setActiveTab('Passenger')">Passenger</button>
      <button [class.active]="activeTab === 'Bus Owners'" (click)="setActiveTab('Bus Owners')">Bus Owners</button>
      <button [class.active]="activeTab === 'Lounge owners'" (click)="setActiveTab('Lounge owners')">Lounge owners</button>
      <button [class.active]="activeTab === 'Drivers'" (click)="setActiveTab('Drivers')">Drivers</button>
      <button [class.active]="activeTab === 'Conductors'" (click)="setActiveTab('Conductors')">Conductors</button>
    </div>
  </div>

  <div class="stats-cards">
    <div class="card" *ngFor="let stat of stats">
      <div class="card-icon" [ngClass]="stat.color">
        <i [class]="stat.icon"></i>
      </div>
      <div class="card-info">
        <span class="count">{{stat.count}}</span>
        <span class="title">{{stat.title}}</span>
      </div>
    </div>
  </div>

  <div class="feedback-section">
    <h2>Feedbacks</h2>
    <p-table [value]="filteredFeedbacks" [tableStyle]="{'min-width': '60rem'}" styleClass="p-datatable-sm">
      <ng-template pTemplate="header">
        <tr>
          <th>Feedback ID</th>
          <th>User Role</th>
          <th>Name</th>
          <th>Message</th>
          <th>Ratings</th>
          <th>Date</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-feedback>
        <tr>
          <td>{{feedback.id}}</td>
          <td>{{feedback.role}}</td>
          <td>{{feedback.name}}</td>
          <td>{{feedback.message}}</td>
          <td>
            <p-rating [ngModel]="feedback.rating" [readonly]="true"></p-rating>
          </td>
          <td>{{feedback.date}}</td>
          <td>
            <p-select [options]="statusOptions" [(ngModel)]="feedback.status" 
              styleClass="status-dropdown"
              appendTo="body"></p-select>
          </td>
          <td>
            <button class="icon-btn" (click)="viewFeedback(feedback)">
              <i class="pi pi-eye"></i>
            </button>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>

  <p-dialog 
    [(visible)]="displayViewModal" 
    [modal]="true" 
    [style]="{width: '600px'}" 
    styleClass="feedback-view-dialog"
    [draggable]="false" 
    [resizable]="false"
    [closable]="true"
    maskStyleClass="blur-mask">
    
    <ng-template pTemplate="header">
      <span class="p-dialog-title">View Feedback</span>
    </ng-template>

    <div class="feedback-details-grid" *ngIf="selectedFeedback">
      <div class="form-group">
        <label>Feedback ID</label>
        <input type="text" [value]="selectedFeedback.id" readonly class="readonly-input">
      </div>
      
      <div class="form-group">
        <label>User Role</label>
        <input type="text" [value]="selectedFeedback.role" readonly class="readonly-input">
      </div>

      <div class="form-group">
        <label>Name</label>
        <input type="text" [value]="selectedFeedback.name" readonly class="readonly-input">
      </div>

      <div class="form-group">
        <label>Rating</label>
        <div class="rating-display readonly-input">
          <p-rating [ngModel]="selectedFeedback.rating" [readonly]="true"></p-rating>
        </div>
      </div>

      <div class="form-group full-width">
        <label>Date</label>
        <input type="text" [value]="selectedFeedback.date" readonly class="readonly-input">
      </div>

      <div class="form-group full-width">
        <label>Feedback message</label>
        <textarea pInputTextarea [value]="selectedFeedback.message" readonly class="readonly-input" rows="3"></textarea>
      </div>

      <div class="form-group full-width">
        <label>Reply</label>
        <textarea pInputTextarea [(ngModel)]="replyMessage" rows="3"></textarea>
      </div>
    </div>

    <ng-template pTemplate="footer">
      <div class="dialog-footer">
        <button pButton label="Submit" class="p-button-secondary" (click)="submitReply()"></button>
      </div>
    </ng-template>
  </p-dialog>
</div>
