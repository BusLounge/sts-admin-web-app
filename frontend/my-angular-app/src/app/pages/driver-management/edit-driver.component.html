<div class="edit-driver-page" *ngIf="driver as d">
    <div class="page-header">
      <h2>Edit Driver - {{ d.first_name }} {{ d.last_name }}</h2>
    </div>
  
    <form class="driver-form" (ngSubmit)="save()">
      <div class="form-row">
        <label>First Name<span class="req">*</span></label>
        <input type="text" [(ngModel)]="d.first_name" name="first_name" required minlength="2" />
      </div>
  
      <div class="form-row">
        <label>Last Name<span class="req">*</span></label>
        <input type="text" [(ngModel)]="d.last_name" name="last_name" required minlength="2" />
      </div>
  
      <div class="form-row">
        <label>Email<span class="req">*</span></label>
        <input type="email" [(ngModel)]="d.email" name="email" required />
      </div>
  
      <div class="form-row">
        <label>Phone<span class="req">*</span></label>
        <input type="tel" [(ngModel)]="d.phone" name="phone" required />
      </div>
  
      <div class="form-row">
        <label>License Number<span class="req">*</span></label>
        <input type="text" [(ngModel)]="d.license_number" name="license_number" required />
      </div>
  
      <div class="form-row">
        <label>License Expiry<span class="req">*</span></label>
        <input type="date" [(ngModel)]="d.license_expiry" name="license_expiry" required />
      </div>
  
      <div class="form-row">
        <label>Experience (Years)<span class="req">*</span></label>
        <input type="number" [(ngModel)]="d.experience_years" name="experience_years" min="0" max="50" required />
      </div>
  
      <div class="form-row">
        <label>Assigned Bus ID</label>
        <input type="text" [(ngModel)]="d.assigned_bus_id" name="assigned_bus_id" />
      </div>
  
      <div class="form-row">
        <label>Hire Date<span class="req">*</span></label>
        <input type="date" [(ngModel)]="d.hire_date" name="hire_date" required />
      </div>
  
      <div class="form-row inline">
        <label class="checkbox">
          <input type="checkbox" [(ngModel)]="d.is_active" name="is_active" />
          <span>Active</span>
        </label>
      </div>
  
      <div class="form-actions">
        <button type="button" class="btn secondary" (click)="cancel()">Cancel</button>
        <button type="submit" class="btn primary" [disabled]="isSubmitting">{{ isSubmitting ? 'Saving...' : 'Save' }}</button>
      </div>
    </form>
  </div>
