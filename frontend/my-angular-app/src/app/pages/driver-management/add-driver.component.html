<div class="add-driver-page">
    <div class="page-header">
      <h2>Add Driver</h2>
    </div>
  
    <form class="driver-form" #f="ngForm" (ngSubmit)="save()">
      <div class="form-row">
        <label>First Name<span class="req">*</span></label>
        <input type="text" [(ngModel)]="form.first_name" name="first_name" placeholder="e.g., John" required minlength="2" />
        <small class="error" *ngIf="f.submitted && !form.first_name">First Name is required.</small>
        <small class="error" *ngIf="f.submitted && form.first_name && form.first_name.length < 2">Min 2 characters.</small>
      </div>
  
      <div class="form-row">
        <label>Last Name<span class="req">*</span></label>
        <input type="text" [(ngModel)]="form.last_name" name="last_name" placeholder="e.g., Doe" required minlength="2" />
        <small class="error" *ngIf="f.submitted && !form.last_name">Last Name is required.</small>
        <small class="error" *ngIf="f.submitted && form.last_name && form.last_name.length < 2">Min 2 characters.</small>
      </div>
  
      <div class="form-row">
        <label>Email<span class="req">*</span></label>
        <input type="email" [(ngModel)]="form.email" name="email" placeholder="e.g., john.doe@example.com" required email />
        <small class="error" *ngIf="f.submitted && !form.email">Email is required.</small>
        <small class="error" *ngIf="f.submitted && form.email && !isValidEmail(form.email)">Invalid email format.</small>
      </div>
  
      <div class="form-row">
        <label>Phone<span class="req">*</span></label>
        <input type="tel" [(ngModel)]="form.phone" name="phone" placeholder="e.g., +977-9841234567" required />
        <small class="error" *ngIf="f.submitted && !form.phone">Phone is required.</small>
      </div>
  
      <div class="form-row">
        <label>License Number<span class="req">*</span></label>
        <input type="text" [(ngModel)]="form.license_number" name="license_number" placeholder="e.g., LIC123456" required />
        <small class="error" *ngIf="f.submitted && !form.license_number">License Number is required.</small>
      </div>
  
      <div class="form-row">
        <label>License Expiry<span class="req">*</span></label>
        <input type="date" [(ngModel)]="form.license_expiry" name="license_expiry" required />
        <small class="error" *ngIf="f.submitted && !form.license_expiry">License Expiry is required.</small>
      </div>
  
      <div class="form-row">
        <label>Experience (Years)<span class="req">*</span></label>
        <input type="number" [(ngModel)]="form.experience_years" name="experience_years" placeholder="e.g., 5" min="0" max="50" required />
        <small class="error" *ngIf="f.submitted && !form.experience_years">Experience is required.</small>
        <small class="error" *ngIf="f.submitted && form.experience_years && (form.experience_years < 0 || form.experience_years > 50)">Experience must be 0-50 years.</small>
      </div>
  
      <div class="form-row">
        <label>Assigned Bus ID</label>
        <input type="text" [(ngModel)]="form.assigned_bus_id" name="assigned_bus_id" placeholder="e.g., BUS001" />
      </div>
  
      <div class="form-row">
        <label>Hire Date<span class="req">*</span></label>
        <input type="date" [(ngModel)]="form.hire_date" name="hire_date" required />
        <small class="error" *ngIf="f.submitted && !form.hire_date">Hire Date is required.</small>
      </div>
  
      <div class="form-row inline">
        <label class="checkbox">
          <input type="checkbox" [(ngModel)]="form.is_active" name="is_active" />
          <span>Active</span>
        </label>
      </div>
  
      <div class="form-actions">
        <button type="button" class="btn secondary" (click)="cancel()">Cancel</button>
        <button type="submit" class="btn primary" [disabled]="isSubmitting">{{ isSubmitting ? 'Saving...' : 'Save' }}</button>
      </div>
    </form>
  </div>
