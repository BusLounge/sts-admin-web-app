<div class="management-container">
  <div class="main-content">
    <div class="edit-container" *ngIf="booking; else notFoundTpl">
      <h2>Edit Lounge Booking</h2>
      <form (ngSubmit)="save()">
        <div class="grid">
          <!-- Locked/readonly fields -->
          <label>
            Booking ID
            <input [value]="booking.booking_id" disabled />
          </label>
          <label>
            Passenger ID
            <input [value]="booking.passenger_id" disabled />
          </label>
          <label>
            Lounge Name
            <input [value]="booking.lounge_name" disabled />
          </label>
          <label>
            Date & Time (locked)
            <input [value]="startDateTime" disabled />
          </label>

          <!-- Editable fields -->
          <label>
            Duration (hours)
            <input type="number" min="1" [(ngModel)]="formDurationHours" name="duration_hours" required />
          </label>
          <label>
            Guests
            <input type="number" min="0" [(ngModel)]="formGuests" name="guests" required />
          </label>
          <label>
            Capacity Used
            <input type="number" min="0" [(ngModel)]="formCapacityUsed" name="capacity_used" required />
          </label>
        </div>
        <div class="actions">
          <button type="submit">Save</button>
          <button type="button" class="secondary" (click)="cancel()">Cancel</button>
        </div>
      </form>
    </div>

    <ng-template #notFoundTpl>
      <div class="edit-container">
        <h2>Booking not found</h2>
        <button class="secondary" (click)="cancel()">Back</button>
      </div>
    </ng-template>
  </div>
</div>
