<div class="management-container">
  <div class="main-content">
    <div class="edit-container">
      <h2>Add Lounge</h2>
      <form (ngSubmit)="save()">
        <div class="grid">
          <label>
            Owner
            <input [(ngModel)]="lounge.owner" name="owner" required />
          </label>
          <label>
            Lounge Name
            <input [(ngModel)]="lounge.name" name="name" required />
          </label>
          <label>
            Address
            <input [(ngModel)]="lounge.address" name="address" required />
          </label>
          <label>
            Phone
            <input [(ngModel)]="lounge.phone" name="phone" required />
          </label>
          <label>
            Capacity
            <input type="number" [(ngModel)]="lounge.capacity" name="capacity" required />
          </label>
          <label>
            Price / Hour
            <input type="number" [(ngModel)]="lounge.price_per_hour" name="price" required />
          </label>
          <label>
            Operating Hours
            <input [(ngModel)]="lounge.operating_hours" name="operating_hours" placeholder="08:00-22:00" />
          </label>
          <label>
            Amenities
            <select multiple [(ngModel)]="selectedAmenities" name="amenities">
              <option *ngFor="let amenity of availableAmenities" [value]="amenity">{{ amenity }}</option>
            </select>
          </label>
          <label>
            Services
            <select multiple [(ngModel)]="selectedServices" name="services">
              <option *ngFor="let service of availableServices" [value]="service">{{ service }}</option>
            </select>
          </label>
        </div>
        <div class="actions">
          <button type="submit">Save</button>
          <button type="button" class="secondary" (click)="cancel()">Cancel</button>
        </div>
      </form>
    </div>
  </div>
</div>
