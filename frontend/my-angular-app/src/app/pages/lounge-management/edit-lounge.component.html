<div class="management-container">
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M2 17L12 22L22 17" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M2 12L12 17L22 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="logo-text" *ngIf="sidebarOpen">Admin Panel</span>
      </div>
    </div>

    <nav class="sidebar-nav">
      <ul class="nav-list">
        <li class="nav-item" [class.active]="currentPage === 'dashboard'">
          <a (click)="navigateTo('dashboard')" class="nav-link">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="3" y="3" width="7" height="7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <rect x="14" y="3" width="7" height="7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <rect x="14" y="14" width="7" height="7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <rect x="3" y="14" width="7" height="7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span *ngIf="sidebarOpen">Dashboard</span>
          </a>
        </li>

        <li class="nav-item" [class.active]="currentPage === 'bus-management'">
          <a (click)="navigateTo('bus-management')" class="nav-link">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M4 16C4 17.1 4.9 18 6 18H18C19.1 18 20 17.1 20 16V8C20 6.9 19.1 6 18 6H6C4.9 6 4 6.9 4 8V16Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M8 6V4C8 2.9 8.9 2 10 2H14C15.1 2 16 2.9 16 4V6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M12 12V12.01" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span *ngIf="sidebarOpen">Bus Management</span>
          </a>
        </li>

        <li class="nav-item" [class.active]="currentPage === 'driver-management'">
          <a (click)="navigateTo('driver-management')" class="nav-link">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M20 21V19C20 17.9391 19.5786 16.9217 18.8284 16.1716C18.0783 15.4214 17.0609 15 16 15H8C6.93913 15 5.92172 15.4214 5.17157 16.1716C4.42143 16.9217 4 17.9391 4 19V21" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="12" cy="7" r="4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span *ngIf="sidebarOpen">Driver Management</span>
          </a>
        </li>

        <li class="nav-item" [class.active]="currentPage === 'passengers'">
          <a (click)="navigateTo('passengers')" class="nav-link">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M20 21V19C20 17.9391 19.5786 16.9217 18.8284 16.1716C18.0783 15.4214 17.0609 15 16 15H8C6.93913 15 5.92172 15.4214 5.17157 16.1716C4.42143 16.9217 4 17.9391 4 19V21" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="12" cy="7" r="4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span *ngIf="sidebarOpen">Passenger Management</span>
          </a>
        </li>

        <li class="nav-item" [class.active]="currentPage === 'lounges'">
          <a (click)="navigateTo('lounges')" class="nav-link">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M3 9L12 2L21 9V20C21 20.5304 20.7893 21.0391 20.4142 21.4142C20.0391 21.7893 19.5304 22 19 22H5C4.46957 22 3.96086 21.7893 3.58579 21.4142C3.21071 21.0391 3 20.5304 3 20V9Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M9 22V12H15V22" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span *ngIf="sidebarOpen">Lounge Management</span>
          </a>
        </li>

        <li class="nav-item" [class.active]="currentPage === 'bus-booking'">
          <a (click)="navigateTo('bus-booking')" class="nav-link">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <line x1="16" y1="2" x2="16" y2="6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <line x1="8" y1="2" x2="8" y2="6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <line x1="3" y1="10" x2="21" y2="10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span *ngIf="sidebarOpen">Bus Booking Management</span>
          </a>
        </li>
      </ul>
    </nav>
  </div>

  <div class="main-content">
    <div class="edit-container" *ngIf="lounge; else notFoundTpl">
      <h2>Edit Lounge</h2>
      <form (ngSubmit)="save()">
        <div class="grid">
          <label>
            Owner
            <input [(ngModel)]="lounge.owner" name="owner" required />
          </label>
          <label>
            Lounge Name
            <input [(ngModel)]="lounge.name" name="name" required />
          </label>
          <label>
            Address
            <input [(ngModel)]="lounge.address" name="address" required />
          </label>
          <label>
            Phone
            <input [(ngModel)]="lounge.phone" name="phone" required />
          </label>
          <label>
            Capacity
            <input type="number" [(ngModel)]="lounge.capacity" name="capacity" required />
          </label>
          <label>
            Price / Hour
            <input type="number" [(ngModel)]="lounge.price_per_hour" name="price" required />
          </label>
          <label>
            Operating Hours
            <input [(ngModel)]="lounge.operating_hours" name="operating_hours" placeholder="08:00-22:00" />
          </label>
          <label class="span-2">
            Amenities (comma-separated)
            <input [(ngModel)]="amenitiesText" name="amenities" />
          </label>
          <label class="span-2">
            Services (comma-separated)
            <input [(ngModel)]="servicesText" name="services" />
          </label>
        </div>
        <div class="actions">
          <button type="submit">Save</button>
          <button type="button" class="secondary" (click)="cancel()">Cancel</button>
        </div>
      </form>
    </div>
    <ng-template #notFoundTpl>
      <div class="edit-container">
        <h2>Lounge not found</h2>
        <button class="secondary" (click)="cancel()">Back</button>
      </div>
    </ng-template>
  </div>
</div>
