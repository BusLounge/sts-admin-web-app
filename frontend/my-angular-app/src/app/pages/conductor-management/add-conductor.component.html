<div class="add-conductor-page">
  <nav class="back-nav" (click)="goBack()" aria-label="Back">
    <span class="arrow">‹</span>
    <span class="label">Back</span>
  </nav>

  <div class="page-header">
    <h2>Add New Conductor</h2>
  </div>

  <form class="conductor-form" #f="ngForm" (ngSubmit)="save()">
    <div class="form-columns">
      <!-- Left Column -->
      <div class="form-column">
        <div class="form-row">
          <label>Full Name<span class="req">*</span></label>
          <input type="text" [(ngModel)]="form.full_name" name="full_name" placeholder="e.g., Raj Kumar Sharma" required minlength="2"
            #fullNameModel="ngModel" (input)="onFullNameChange()"
            [class.error-input]="validationErrors.full_name && (fullNameModel.dirty || fullNameModel.touched || isFormSubmitted)" />
          <small class="error" *ngIf="validationErrors.full_name && (fullNameModel.dirty || fullNameModel.touched || isFormSubmitted)">{{ validationErrors.full_name }}</small>
        </div>

        <div class="form-row">
          <label>Phone Number<span class="req">*</span></label>
          <input type="tel" [(ngModel)]="form.phone_number" name="phone_number" placeholder="e.g., 9841234567" required
            #phoneModel="ngModel" (input)="onPhoneNumberChange()"
            [class.error-input]="validationErrors.phone_number && (phoneModel.dirty || phoneModel.touched || isFormSubmitted)" />
          <small class="error" *ngIf="validationErrors.phone_number && (phoneModel.dirty || phoneModel.touched || isFormSubmitted)">{{ validationErrors.phone_number }}</small>
        </div>

        <div class="form-row">
          <label>Status<span class="req">*</span></label>
          <select [(ngModel)]="form.status" name="status" required>
            <option value="Active">Active</option>
            <option value="On Leave">On Leave</option>
            <option value="Resigned">Resigned</option>
          </select>
        </div>

        <div class="form-row">
          <label>Assigned Bus ID</label>
          <input type="text" [(ngModel)]="form.assigned_bus_id" name="assigned_bus_id" placeholder="e.g., BUS001"
            #busIdModel="ngModel" (input)="onAssignedBusIdChange()"
            [class.error-input]="validationErrors.assigned_bus_id && (busIdModel.dirty || busIdModel.touched || isFormSubmitted)" />
          <small class="error" *ngIf="validationErrors.assigned_bus_id && (busIdModel.dirty || busIdModel.touched || isFormSubmitted)">{{ validationErrors.assigned_bus_id }}</small>
        </div>
      </div>

      <!-- Right Column -->
      <div class="form-column">
        <div class="form-row">
          <label>NIC (National Identity Card)<span class="req">*</span></label>
          <input type="text" [(ngModel)]="form.nic" name="nic" placeholder="e.g., 123456789V or 123456789012" required
            #nicModel="ngModel" (input)="onNICChange()"
            [class.error-input]="validationErrors.nic && (nicModel.dirty || nicModel.touched || isFormSubmitted)" />
          <small class="error" *ngIf="validationErrors.nic && (nicModel.dirty || nicModel.touched || isFormSubmitted)">{{ validationErrors.nic }}</small>
        </div>

        <div class="form-row">
          <label>Experience (Years)<span class="req">*</span></label>
          <input type="number" [(ngModel)]="form.experience_years" name="experience_years" placeholder="e.g., 5" min="0" max="50" required
            #experienceModel="ngModel" (input)="onExperienceChange()"
            [class.error-input]="validationErrors.experience_years && (experienceModel.dirty || experienceModel.touched || isFormSubmitted)" />
          <small class="error" *ngIf="validationErrors.experience_years && (experienceModel.dirty || experienceModel.touched || isFormSubmitted)">{{ validationErrors.experience_years }}</small>
        </div>

        <div class="form-row">
          <label>Hire Date<span class="req">*</span></label>
          <input type="date" [(ngModel)]="form.hired_date" name="hired_date" required
            #hireDateModel="ngModel" (input)="onHireDateChange()"
            [class.error-input]="validationErrors.hired_date && (hireDateModel.dirty || hireDateModel.touched || isFormSubmitted)" />
          <small class="error" *ngIf="validationErrors.hired_date && (hireDateModel.dirty || hireDateModel.touched || isFormSubmitted)">{{ validationErrors.hired_date }}</small>
        </div>
      </div>
    </div>

    <div class="form-actions">
      <button type="button" class="btn secondary" (click)="cancel()">Cancel</button>
      <button type="submit" class="btn primary" [disabled]="isSubmitting || !isFormValid()">{{ isSubmitting ? 'Saving...' : 'Save' }}</button>
    </div>
  </form>
</div>
