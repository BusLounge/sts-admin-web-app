<div class="edit-bus-page" *ngIf="bus as b">
  <div class="page-header">
    <h2>Edit Bus - {{ b.bus_number }}</h2>
  </div>

  <form class="bus-form" (ngSubmit)="save()">
    <div class="form-row">
      <label>Bus Number</label>
      <input type="text" [(ngModel)]="b.bus_number" name="bus_number" required />
    </div>

    <div class="form-row">
      <label>Capacity</label>
      <input type="number" [(ngModel)]="b.capacity" name="capacity" min="1" max="120" required />
    </div>

    <div class="form-row">
      <label>Type</label>
      <select [(ngModel)]="b.type" name="type">
        <option value="AC">AC</option>
        <option value="Non-AC">Non-AC</option>
        <option value="Luxury">Luxury</option>
      </select>
    </div>

    <div class="form-row inline">
      <label class="checkbox">
        <input type="checkbox" [(ngModel)]="b.is_active" name="is_active" />
        <span>Active</span>
      </label>
    </div>

    <div class="form-row">
      <label>Assigned Route ID</label>
      <input type="text" [(ngModel)]="b.assigned_route_id" name="assigned_route_id" required />
    </div>

    <div class="form-actions">
      <button type="button" class="btn secondary" (click)="cancel()">Cancel</button>
      <button type="submit" class="btn primary" [disabled]="isSubmitting">{{ isSubmitting ? 'Saving...' : 'Save' }}</button>
    </div>
  </form>
</div>
