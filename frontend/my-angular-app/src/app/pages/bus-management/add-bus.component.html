<div class="add-bus-page">
  <div class="page-header">
    <h2>Add Bus</h2>
  </div>

  <form class="bus-form" #f="ngForm" (ngSubmit)="save()">
    <div class="form-row">
      <label>Bus Number<span class="req">*</span></label>
      <input type="text" [(ngModel)]="form.bus_number" name="bus_number" placeholder="e.g., NP1234" required minlength="3" />
      <small class="error" *ngIf="f.submitted && !form.bus_number">Bus Number is required.</small>
      <small class="error" *ngIf="f.submitted && form.bus_number && form.bus_number.length < 3">Min 3 characters.</small>
    </div>

    <div class="form-row">
      <label>Capacity<span class="req">*</span></label>
      <input type="number" [(ngModel)]="form.capacity" name="capacity" placeholder="e.g., 50" min="1" max="120" required />
      <small class="error" *ngIf="f.submitted && !form.capacity">Capacity is required.</small>
      <small class="error" *ngIf="f.submitted && form.capacity && (form.capacity < 1 || form.capacity > 120)">Capacity must be 1-120.</small>
    </div>

    <div class="form-row">
      <label>Type</label>
      <select [(ngModel)]="form.type" name="type">
        <option value="AC">AC</option>
        <option value="Non-AC">Non-AC</option>
        <option value="Luxury">Luxury</option>
      </select>
    </div>

    <div class="form-row inline">
      <label class="checkbox">
        <input type="checkbox" [(ngModel)]="form.is_active" name="is_active" />
        <span>Active</span>
      </label>
    </div>

    <div class="form-row">
      <label>Assigned Route ID<span class="req">*</span></label>
      <input type="text" [(ngModel)]="form.assigned_route_id" name="assigned_route_id" placeholder="e.g., RT001" required />
      <small class="error" *ngIf="f.submitted && !form.assigned_route_id">Route ID is required.</small>
    </div>

    <div class="form-actions">
      <button type="button" class="btn secondary" (click)="cancel()">Cancel</button>
      <button type="submit" class="btn primary" [disabled]="isSubmitting">{{ isSubmitting ? 'Saving...' : 'Save' }}</button>
    </div>
  </form>
</div>
